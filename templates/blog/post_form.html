{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><a class="back-link" href="{% url 'dashboard' %}">← Dashboard</a><h1 class="section-title my-3">{{ heading }}</h1><div class="side-panel"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-dark">Save post</button><a class="btn btn-light" href="{% url 'dashboard' %}">Cancel</a></form></div></div></div>{% endblock %}
